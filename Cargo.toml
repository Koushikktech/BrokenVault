[package]
name = "brokenvault"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"

[lib]
name = "brokenvault"
path = "src/lib.rs"

[[bin]]
name = "bv"
path = "src/bin/bv.rs"

[[bin]]
name = "bvd"
path = "src/bin/bvd.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
axum = { version = "0.8", features = ["tokio"] }
rusqlite = { version = "0.33", features = ["bundled"] }
fastcdc = "=3.1.0"
ureq = { version = "3", default-features = false, features = ["json"] }
sha2 = "0.10"
hex = "0.4"
rayon = "1.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.5", features = ["derive"] }
thiserror = "2.0"
anyhow = "1.0"
walkdir = "2.5"
filetime = "0.2"
indicatif = "0.17"
ctrlc = "3.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rand = "0.8"
rand_chacha = "0.3"

[dev-dependencies]
tempfile = "3.17"
proptest = "1.6"

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
